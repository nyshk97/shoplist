[tasks.generate]
description = "Xcode プロジェクト生成"
run = "bash scripts/generate-projects.sh"

[tasks.dev]
description = "API ローカル開発サーバー起動"
run = "cd apps/api && npm run dev"

[tasks.test]
description = "API テスト実行"
run = "cd apps/api && npm test"

[tasks.deploy]
description = "API を本番にデプロイ"
run = "cd apps/api && npx wrangler deploy"

[tasks."deploy:migrate"]
description = "本番 DB にマイグレーション適用"
run = "cd apps/api && npx wrangler d1 migrations apply shoplist-db --remote"

[tasks."ios:device"]
description = "iOS アプリを実機に Release で入れて起動 (ペアリング済みなら USB 不要・端末のロック解除が必要)"
usage = 'arg "[device]" help="入れる端末（名前・iPhone / iPad・UDID の一部。all で全部）。実機が 1 台なら省略可" default=""'
run = 'bash scripts/install-ios-device.sh "$usage_device"'

[tasks."build:ios"]
description = "iOS アプリを Xcode で開く (実機接続後 Cmd+R でインストール)"
run = """
bash scripts/generate-projects.sh
open apps/ios/Shoplist.xcodeproj
"""
